# Compiler Configuration
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental.useClasspathSnapshot=true

# libxposed:service:102.0.0 (used to publish the module settings to the framework) declares
# minCompileSdk=37 in its AAR metadata. We intentionally keep compiling against android-34,
# so the check is disabled instead of bumping the whole toolchain.
android.experimental.disableCompileSdkChecks=true
